name: MakeCode Build
on:
  push:
    paths-ignore:
      - "botsim/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
        actions: read
        contents: write    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - run: npm install -g makecode
      - run: sh mkhex.sh
